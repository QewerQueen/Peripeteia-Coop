## Settings file for Peripeteia Coop
## Plugin GUID: peripeteia.coop

[Client]

## Prevent a co-op client from writing save files. Loading is unaffected.
# Setting type: Boolean
# Default value: true
BlockSaves = true

[Probe]

## Log basic player state every few seconds. Development only.
# Setting type: Boolean
# Default value: false
Enabled = false

## Development only: dump the player hierarchy and playerSkins prefabs once.
# Setting type: Boolean
# Default value: false
DumpHierarchy = false

[Ui]

## Show a small connection status overlay in co-op mode.
# Setting type: Boolean
# Default value: true
ShowStatus = true

[Weapon]

## Lower the remote weapon from the wrist bone, in meters.
## Increase this if the gun floats above the hand.
# Setting type: Single
# Default value: 0.04
GripDown = 0.04

## Move the remote weapon toward the fingers, in meters.
## Small adjustments only.
# Setting type: Single
# Default value: 0.015
GripForward = 0.015
