## Settings file for Peripeteia Coop
## Plugin GUID: peripeteia.coop

[Client]

## Prevent a co-op client from writing save files. Loading is unaffected.
# Setting type: Boolean
# Default value: true
BlockSaves = true

## Stop a co-op client from loading a save mid-level on its own; that would
## rewind the client's copy of the shared world and desync it from the host.
## A rollback is a host decision: the host loads the save and the client loads
## the same one on request. The initial load and scene transitions still work.
# Setting type: Boolean
# Default value: true
BlockRollback = true

[Probe]

## Log basic player state every few seconds. Development only.
# Setting type: Boolean
# Default value: false
Enabled = false

## Development only: dump the player hierarchy and playerSkins prefabs once.
# Setting type: Boolean
# Default value: false
DumpHierarchy = false

[Ui]

## Show a small connection status overlay in co-op mode.
# Setting type: Boolean
# Default value: true
ShowStatus = true

[Weapon]

## Optional fine-tune: lower the remote weapon in the hand's local space.
## Leave at 0 to copy the sender exactly.
# Setting type: Single
# Default value: 0
GripDown = 0

## Optional fine-tune: move the remote weapon toward the fingers.
## Leave at 0 to copy the sender exactly.
# Setting type: Single
# Default value: 0
GripForward = 0

## Fallback distance from the wrist to the palm along the hand bone.
## Used when the real hand-grip offset is unavailable. 0.02-0.05 is normal.
# Setting type: Single
# Default value: 0.03
PalmOffset = 0.03

## Mirror the sender's per-part visibility (attachments, magazine, folded stock)
## onto the remote weapon visual. Turn off to always show the plain template
## weapon.
# Setting type: Boolean
# Default value: true
SyncAttachments = true

[Combat]

## Enable player-versus-player combat: remote players get a physics proxy
## so they can be shot.
# Setting type: Boolean
# Default value: true
Enabled = true

## Allow bullets to actually damage the other player.
## Turn off to keep the hit proxy but ignore damage.
# Setting type: Boolean
# Default value: true
PlayerDamage = true

## Make the other player solid so you cannot walk through them.
## Uses per-collider ignore settings and never touches the global layer matrix.
# Setting type: Boolean
# Default value: true
PlayerCollision = true

## Physics layer for the remote player's hit/collision proxy.
## -1 copies the local player's own layer.
# Setting type: Int32
# Default value: -1
CollisionLayer = -1

## Multiplier applied to weapon damage before it is sent to the other player.
# Setting type: Single
# Default value: 1
DamageScale = 1

## Give the remote player capsule hitboxes on the arms and legs (following the
## animated bones) so shots at a limb register instead of passing through. Turn
## off to keep only the torso capsule and head sphere.
# Setting type: Boolean
# Default value: true
LimbHitboxes = true

[Items]

## When a player drops an item this side never had (for example a quest reward),
## clone a matching template from the scene so the teammate can see and pick it
## up. Turn off to only sync items both sides already have.
# Setting type: Boolean
# Default value: true
SpawnMissing = true

## Key/quest items (the item a keycard or access point checks for) are not
## synchronized as world pickups: each player keeps their own copy, so both can
## pick up the key and open the same door. Turn off to make keys single-pickup
## like every other item.
# Setting type: Boolean
# Default value: true
ShareKeyItems = true

## Host-authoritative world items: only the host broadcasts an item's position
## and visibility, while a client sends just its own actions (pickup, drop,
## break, drag) as requests. Stops the two machines from fighting over the same
## object. Turn off to go back to the old peer-to-peer item sync.
# Setting type: Boolean
# Default value: true
HostAuthoritative = true

[Ai]

## Synchronize NPCs/enemies as part of the shared world. Inventory, money and
## player health stay personal regardless of this setting.
# Setting type: Boolean
# Default value: true
Enabled = true

## Share enemy deaths: a kill by either player counts for both, even when
## MirrorEnemies is off.
# Setting type: Boolean
# Default value: true
SyncDeaths = true

## Host-authoritative NPC mirroring: the host simulates the AI and clients
## follow its transform, animation and health. Turn off to let each side run
## its own AI (only deaths stay shared).
# Setting type: Boolean
# Default value: true
MirrorEnemies = true

## When mirroring, stop the client's own AI for mirrored enemies so it cannot
## fight the host's simulation. Requires MirrorEnemies.
# Setting type: Boolean
# Default value: true
FreezeClientAi = true

## Host only: register the remote player as an AI target so enemies can notice,
## chase and shoot at the client. The puppet also gets an inert HealthScript,
## because the game ignores any target without one. Experimental.
# Setting type: Boolean
# Default value: true
TargetRemotePlayer = true

## Host only: add an inert collider on the layer the game's AI uses to detect the
## player. The combat proxy lives on the player's own (Ignore Raycast) layer, so
## without this the perception rays pass through the puppet. Requires
## TargetRemotePlayer.
# Setting type: Boolean
# Default value: true
PerceptionCollider = true

## Host only: NPC shots that hit the client deal damage on the client's machine
## (through its real HealthScript). Enemy weapons use the same Shoot component as
## the player's, so this reuses the player-versus-player hit path. Requires
## TargetRemotePlayer.
# Setting type: Boolean
# Default value: true
DamageRemotePlayer = true

[Story]

## Share the story: dialogues, quest objects and scripted teleports follow one
## branch, consumed by whichever player reaches them first.
# Setting type: Boolean
# Default value: true
Enabled = true

## A dialogue started by one player cannot be started by the other. Keeps quest
## rewards (items, money) from being granted twice.
# Setting type: Boolean
# Default value: true
LockDialogues = true

## A one-time quest object used by one player is locked for the other. Objects
## with multipleUse stay available to both.
# Setting type: Boolean
# Default value: true
LockQuestActions = true

## Replay the world GameObjects a quest object switches on/off on the other
## machine, so both see the same doors and props.
# Setting type: Boolean
# Default value: true
SyncActivations = true

## A scripted (non walk-in) teleport moves both players. A teleporter the player
## simply walks into stays local and repeatable.
# Setting type: Boolean
# Default value: true
SyncTeleports = true

## Replay a video cutscene started by one player on the other machine, so the
## whole party sees it.
# Setting type: Boolean
# Default value: true
SyncCutscenes = true

## Share the quest-log effects of a dialogue branch (NPCConversation.SetQuestLog
## / RemoveQuestLog) and, when ShareItemRewards is on, the equipment a branch
## gifts the player. Other item and reward actions are never replayed.
# Setting type: Boolean
# Default value: true
SyncDialogueActions = true

## Replay the world-effect listeners a quest object drives (doors, pistons,
## elevators, GameObject toggles) on the other machine. Reward and inventory
## listeners are never replayed.
# Setting type: Boolean
# Default value: true
SyncQuestEffects = true

## Also replay the listeners that hand the player their equipment
## (GiftGiver.GiveAllGifts / GiveGiftAtIndex) so both players get the same
## starting weapons and kit. Turn off if a unique quest item must stay single.
# Setting type: Boolean
# Default value: true
ShareItemRewards = true

## Also replay the item reward a quest object hands out (ItemInfo.pickupitem),
## so a quest reward reaches both players and the two inventories match. A
## replayed reward does not echo back as a world pickup. Turn off if a quest
## reward must stay with the first player only.
# Setting type: Boolean
# Default value: true
ShareQuestRewards = true

## Mirror the game's named save flags (FlagsForSaveFiles.SetFlag / SetTrue /
## SetFalse) between the machines, so both agree on which quests are done. A flag
## changed during play is set for the other player; a save load does not broadcast.
# Setting type: Boolean
# Default value: true
SyncFlags = true

## Mirror the intro tutorial quest manager (questmanagerTUTORIAL.triggerevent /
## blockevents / unblockevents), so both players see the same tutorial steps and
## their side effects.
# Setting type: Boolean
# Default value: true
SyncQuestEvents = true

[World]

## Keep level transitions in step: when one player walks into a level exit, the
## other machine plays the same transition and follows them into the new level.
## Turn off to move between levels independently.
# Setting type: Boolean
# Default value: true
SyncSceneTransitions = true

[Player]

## Share player death: when one player dies the other sees the body go down,
## and it stands back up on revive.
# Setting type: Boolean
# Default value: true
SyncDeath = true

## Use the game's own ragdoll rig for the remote death (falls and stays down).
## If off, the body simply stops animating.
# Setting type: Boolean
# Default value: true
DeathRagdoll = true

## On death, stand the player back up at the last save point instead of
## reloading the level. Keeps the shared world (doors, NPCs, quest state)
## exactly as it was for both players. Turn off to use the game's normal
## death-load.
# Setting type: Boolean
# Default value: true
RespawnOnDeath = true

## Let you pick up the other player's body: look at the corpse and hold the
## game's interact key to carry it, and the other machine sees it move. The
## corpse is released when you let go, and pinned again once it settles.
# Setting type: Boolean
# Default value: true
DragRemoteBody = true

## Give the remote teammate a different character model than your own (each peer
## keeps its own Marie skin), so the two players in co-op do not look like clones
## of each other.
# Setting type: Boolean
# Default value: true
SyncSkins = true

## Draw a small panel with the teammate's name, health and down/dead state while
## connected.
# Setting type: Boolean
# Default value: true
TeammateHud = true

[Net]

## Host only: broadcast this machine on the LAN so it appears in the other
## player's "Peripeteia Coop" host list. Turn off to stay silent (players can
## still connect with -coop-connect or the "Connect by IP" field).
# Setting type: Boolean
# Default value: true
Advertise = true

## Client only: on connect, automatically download the host's newest save so
## both machines start from the same file. Turn off to only download it from the
## menu button.
# Setting type: Boolean
# Default value: true
AutoDownloadSave = true

## Client only: after the host's save has been downloaded, start the run from it
## automatically instead of waiting for the player to open the game's load menu.
## Only happens while the client is still on the main menu.
# Setting type: Boolean
# Default value: true
AutoStartDownloadedSave = true

## Client only: on connect (and on entering a new level) put this player next to
## the host instead of at the save point. The game drops a freshly loaded player
## at a temporary spawn point high above the map and then lets it fall, so without
## this the client would start far away from the host.
# Setting type: Boolean
# Default value: true
SpawnNearHost = true

## Name shown to the other player and in the LAN host list.
# Setting type: String
# Default value: <machine name>
PlayerName = Player
